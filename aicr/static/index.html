<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能代码审查助手</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="logo">R</span> 智能代码审查助手 <span class="ver">v2 Python</span></a>
    <div class="nav-links">
      <a href="/" class="active">代码审查</a>
      <a href="/chat.html">对话</a>
      <a href="/kb.html">知识库</a>
      <a href="#history">运行记录</a>
      <a href="/settings.html">设置</a>
    </div>
    <div class="nav-right">
      <span id="statusChip" class="status-chip"><span class="dot"></span><span id="statusText">检测中</span></span>
    </div>
  </nav>

  <div class="container">
    <h1 class="page-title">代码审查</h1>
    <p class="page-sub">粘贴代码、上传文件、扫描服务器目录或审查 git 变更，AI 自动多维度专业审查</p>

    <div class="card">
      <div class="toolbar">
        <div class="field">
          <label>文件名（可选）</label>
          <input type="text" id="filename" placeholder="如：server.py">
        </div>
        <div class="field">
          <label>语言（可选）</label>
          <select id="language">
            <option value="">自动识别</option>
            <option>JavaScript</option>
            <option>TypeScript</option>
            <option>Python</option>
            <option>Java</option>
            <option>Go</option>
            <option>Rust</option>
            <option>C</option>
            <option>C++</option>
            <option>C#</option>
            <option>PHP</option>
            <option>SQL</option>
            <option>Shell</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>Vue</option>
            <option>其他</option>
          </select>
        </div>
        <div class="field" style="margin-left:auto">
          <label>&nbsp;</label>
          <button class="btn btn-ghost" id="btnUpload" type="button">上传多文件</button>
          <input type="file" id="fileInput" multiple hidden>
        </div>
      </div>

      <div class="focus-group" id="focusGroup">
        <label><input type="checkbox" value="correctness" checked> 正确性</label>
        <label><input type="checkbox" value="security" checked> 安全性</label>
        <label><input type="checkbox" value="performance" checked> 性能</label>
        <label><input type="checkbox" value="style" checked> 代码风格</label>
        <label><input type="checkbox" value="bestPractice" checked> 最佳实践</label>
        <label><input type="checkbox" value="testing" checked> 测试覆盖</label>
      </div>
      <div style="margin-top:8px">
        <label class="chk-inline"><input type="checkbox" id="multiMode"> 多 Agent 协作审查（6 个专项专家并行，更全面但更耗时）</label>
      </div>

      <div class="code-wrap" style="margin-top:12px">
        <textarea id="code" class="code-editor" placeholder="在此粘贴要审查的代码…"></textarea>
        <div class="code-meta">
          <span id="lineCount">0 行</span>
          <span id="charCount">0 字符</span>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:14px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnReview"><span id="btnIcon">开始审查</span></button>
        <button class="btn btn-ghost" id="btnClear">清空</button>
        <span style="color:var(--text-dim);font-size:12px;margin:0 6px">或批量：</span>
        <input type="text" id="scanPath" placeholder="服务器目录路径，如 D:\projects\demo" style="width:230px">
        <button class="btn btn-ghost" id="btnScanDir">审查目录</button>
        <input type="text" id="gitRepo" placeholder="git 仓库路径" style="width:180px">
        <button class="btn btn-ghost" id="btnGitDiff">审查 git 变更</button>
        <label class="chk-inline"><input type="checkbox" id="gitStaged"> 仅已暂存</label>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingText">AI 正在审查代码，请稍候（可能需要 10-60 秒）...</div>
      </div>
    </div>

    <div id="result" class="card" style="display:none">
      <div class="card-title">审查结果</div>
      <div id="resultBody"></div>
    </div>

    <div class="card" id="history">
      <div class="card-title">运行记录</div>
      <div id="historyList"><div class="empty"><div class="big">📄</div>暂无运行记录</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
